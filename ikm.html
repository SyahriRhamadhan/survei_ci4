<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indeks Kepuasan Masyarakat (IKM)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Basic styles for the container */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            background: #fff;
            max-width: 1200px;
            margin: 20px auto;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h1, h2, h3 {
            color: #003366;
        }

        .card-header {
            background-color: #003366;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-size: 1.5rem;
            border-radius: 8px;
        }

        .card-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-body .row {
            width: 100%;
            margin-bottom: 20px;
        }

        .card-body .col-md-6 {
            text-align: center;
        }

        .card-body p {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .pie-chart {
            width: 200px;
            height: 200px;
            margin-top: 20px;
        }

        .download-button {
            background-color: #28a745;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
        }

        .download-button:hover {
            background-color: #218838;
        }

        .footer {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header Section -->
        <div class="card">
            <div class="card-header">
                <h3>INDEKS KEPUASAN MASYARAKAT UNIVERSITAS MARITIM RAJA ALI HAJI (UMRAH)</h3>
                <h3>Unit Layanan/UPPS <?= htmlspecialchars($nama_unit) ?></h3>
                <h3>Priode </h3>
            </div>

            <!-- Body Section -->
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <div class="card-label text-center">
                                    <h3 class="fw-bold">Indeks Kepuasan Masyarakat</h3>
                                </div>
                                <p><strong>Nilai IKM:</strong> <?= $ikm ?></p>
                                <p><strong>Kategori:</strong> <?= $kategori ?></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <!-- Insert pie chart here using a library or image -->
                        <canvas class="pie-chart" id="ikmChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Download Button -->
            <button id="downloadButton" class="download-button">Download as Image</button>

        </div>

        <!-- Footer Section -->
        <footer class="footer">
            <p>Copyright © SURVEI UMRAH 2024</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
    <script>
        // Function for Pie Chart using Chart.js
        var ctx = document.getElementById('ikmChart').getContext('2d');
        var ikmChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['SD', 'SMP', 'SMA', 'D4/S1', 'D3', 'S2', 'Lainnya'],
                datasets: [{
                    label: 'Pendidikan Terakhir',
                    data: [506, 561, 1596, 517, 196, 30, 828], // Example data
                    backgroundColor: ['#FF7F50', '#6A5ACD', '#FFD700', '#90EE90', '#FF6347', '#32CD32', '#A9A9A9'],
                    borderColor: ['#fff'],
                    borderWidth: 2
                }]
            }
        });

        // Download Image function using html2canvas
        document.getElementById("downloadButton").addEventListener("click", function () {
            var element = document.querySelector(".container");

            if (!element) {
                console.error("Element not found!");
                return;
            }

            html2canvas(element).then(function (canvas) {
                var image = canvas.toDataURL("image/jpeg");

                var link = document.createElement('a');
                link.href = image;
                link.download = "ikm_image.jpg";
                link.click();
            }).catch(function (error) {
                console.error("Error capturing screenshot: ", error);
            });
        });
    </script>
</body>

</html>
